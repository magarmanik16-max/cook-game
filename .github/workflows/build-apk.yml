name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Copper Pan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run unit tests & typecheck
        run: |
          npm run lint
          npx --yes tsx --test src/game/rules.test.ts

      - name: Build production web bundle
        run: npm run build

      - name: Install Capacitor Android tooling
        run: |
          npm install --no-save @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0

      - name: Initialize & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Copper Pan launcher icons
        run: |
          if [ -f "public/pwa-512x512.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
                cp public/pwa-512x512.png "$dir/ic_launcher_round.png" || true
              fi
            done
          fi
          if [ -f "public/pwa-maskable-512x512.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png" || true
              fi
            done
          fi

      - name: Build Android APK (Debug — directly installable)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare downloadable APK filename
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/CopperPan.apk
          ls -lh release-artifacts/CopperPan.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopperPan-Android-APK
          path: release-artifacts/CopperPan.apk
          retention-days: 30

      - name: Publish downloadable APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: Copper Pan Android APK (${{ github.run_number }})
          body: |
            ## Copper Pan — Android APK

            Download **`CopperPan.apk`** below and open it on your Android device to install.

            ### How to Install on Android
            1. Download `CopperPan.apk` on your phone.
            2. Tap the downloaded file (if prompted, allow **Install unknown apps** for your browser).
            3. Launch **Copper Pan** from your home screen!

            > Built automatically from commit `${{ github.sha }}`.
          files: release-artifacts/CopperPan.apk
          make_latest: true
          draft: false
          prerelease: false
