<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFF7EE" />
      <stop offset="100%" stop-color="#F7DEC8" />
    </radialGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F08A62" />
      <stop offset="100%" stop-color="#C94F32" />
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C5335" />
      <stop offset="100%" stop-color="#B9724B" />
    </linearGradient>
  </defs>
  <!-- Rounded clay tile background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#E8CBB3" stroke-width="8" />

  <!-- Warm steam curls -->
  <path d="M214 156 C196 124, 232 100, 214 68" fill="none" stroke="#E3574B" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  <path d="M276 144 C258 112, 294 88, 276 56" fill="none" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" opacity="0.88" />
  <path d="M336 164 C322 136, 352 114, 336 86" fill="none" stroke="#E3574B" stroke-width="14" stroke-linecap="round" opacity="0.72" />

  <!-- Soft contact shadow -->
  <ellipse cx="290" cy="368" rx="142" ry="42" fill="#3D2921" opacity="0.14" />

  <!-- Skillet handle -->
  <path d="M56 266 L176 286 L170 318 L50 296 Z" fill="url(#handle)" stroke="#3D2921" stroke-width="14" stroke-linejoin="round" />
  <circle cx="76" cy="283" r="10" fill="#FFF7EE" />

  <!-- Copper pan rim -->
  <ellipse cx="292" cy="304" rx="154" ry="86" fill="url(#copper)" stroke="#3D2921" stroke-width="16" />
  <!-- Pan interior -->
  <ellipse cx="292" cy="292" rx="126" ry="62" fill="#4A332A" />

  <!-- Sunny-side-up egg -->
  <path d="M222 292 C218 258, 266 244, 304 252 C346 260, 366 290, 344 316 C322 340, 236 336, 222 292 Z" fill="#FFFDF9" stroke="#E7D8C9" stroke-width="6" />
  <circle cx="290" cy="290" r="32" fill="#FBBF24" stroke="#D97706" stroke-width="6" />
  <circle cx="280" cy="280" r="9" fill="#FEF3C7" />

  <!-- Fresh basil leaf garnish -->
  <path d="M332 272 Q358 244 374 268 Q352 288 332 272 Z" fill="#22C55E" stroke="#14532D" stroke-width="5" />
</svg>
